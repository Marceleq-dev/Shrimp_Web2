<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Shrimp Clicker 🦐</title>

<style>
:root{
 --bg1:#283048;
 --bg2:#859398;
 --card:#32323C99;
 --btn:#4e5d6c;
 --btn-hover:#607184;
 --btn-disabled:#333a41;
 --accent:#7dd3fc;
}
html,body{
 height:100%;
 margin:0;
 font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
 background:linear-gradient(135deg,var(--bg1),var(--bg2));
 color:#eee;
}
body{
 display:grid;
 grid-template-columns:1fr minmax(300px,980px) 1fr;
 gap:20px;
 padding:24px 0;
}
.leaderboard-container{grid-column:1/2;padding-left:24px}
.game-container{grid-column:2/3;padding:20px;text-align:center}

.shrimp{
 width:200px;height:200px;
 background:url('https://static.vecteezy.com/system/resources/previews/036/161/836/non_2x/tiger-shrimp-on-a-transparent-background-free-png.png') no-repeat center/contain;
 margin:18px auto;
 cursor:pointer;
 transition:.08s;
}
.shrimp:active{transform:scale(.94)}
.count{font-size:2rem;font-weight:700}
.small{font-size:.9rem;color:#cfd8dc}
.upgrades{
 margin-top:20px;
 background:var(--card);
 padding:18px 26px;
 border-radius:12px;
 display:inline-block;
}
.upgrade-btn{
 display:block;
 width:100%;
 padding:12px;
 margin:8px 0;
 background:var(--btn);
 color:#fff;
 border-radius:8px;
 cursor:pointer;
}
.control-btn{
 background:#1f2937;
 color:#fff;
 border:none;
 padding:8px 12px;
 border-radius:8px;
 cursor:pointer;
}
.modal{
 position:fixed;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:rgba(0,0,0,.45);
 opacity:0;
 pointer-events:none;
 transition:.2s;
}
.modal.show{opacity:1;pointer-events:auto}
.modal-card{
 background:#0f1724;
 padding:18px;
 border-radius:12px;
 color:#fff;
}
</style>
</head>

<body>

<div class="game-container">
<h1>🦐 Shrimp Clicker 🦐</h1>

<div id="shrimp" class="shrimp"></div>

<div class="small">Shrimps</div>
<div id="counter" class="count">0</div>

<div class="controls">
<button id="saveBtn" class="control-btn">Save</button>
<button id="loadBtn" class="control-btn">Load</button>
<button id="sellBtn" class="control-btn">Sell Shrimps</button>
</div>

<div class="upgrades">
<h3>Upgrades</h3>
<button id="upg-net" class="upgrade-btn">Stronger Net (+1 SPC)</button>
<button id="upg-sps1" class="upgrade-btn">Small Fry Factory (+1 SPS)</button>
</div>
</div>

<script>
let shrimp = 0;
let spc = 1;
let sps = 0;

const counterEl = document.getElementById("counter");
const shrimpEl = document.getElementById("shrimp");

function updateUI(){
 counterEl.textContent = Math.floor(shrimp);
}

shrimpEl.addEventListener("click", ()=>{
 shrimp += spc;
 updateUI();
});

setInterval(()=>{
 shrimp += sps/10;
 updateUI();
},100);

document.getElementById("upg-net").onclick = ()=>{
 if(shrimp>=20){
 shrimp-=20;
 spc++;
 updateUI();
 }
};

document.getElementById("upg-sps1").onclick = ()=>{
 if(shrimp>=100){
 shrimp-=100;
 sps++;
 updateUI();
 }
};

document.getElementById("saveBtn").onclick = ()=>{
 localStorage.setItem("shrimpSave", JSON.stringify({shrimp,spc,sps}));
 alert("Saved!");
};

document.getElementById("loadBtn").onclick = ()=>{
 const data = JSON.parse(localStorage.getItem("shrimpSave"));
 if(data){
 shrimp=data.shrimp;
 spc=data.spc;
 sps=data.sps;
 updateUI();
 }
};

document.getElementById("sellBtn").onclick = ()=>{
 shrimp=0;
 updateUI();
};
</script>

</body>
</html>
