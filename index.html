<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Shrimp Clicker 🦐</title>
<style>
body{margin:0;font-family:sans-serif;background:#1e293b;color:#fff;display:flex}
.leaderboard{width:280px;padding:12px;background:#0f172a}
.leaderboard li{display:flex;justify-content:space-between;padding:4px 0}
.game{flex:1;text-align:center;padding:20px}
.shrimp{width:200px;height:200px;background:url("https://static.vecteezy.com/system/resources/previews/036/161/836/non_2x/tiger-shrimp-on-a-transparent-background-free-png.png") no-repeat center/contain;margin:auto;cursor:pointer}
button{margin:4px;padding:6px 12px}
</style>
</head>
<body>

<div class="leaderboard">
<h3>🏆 Leaderboard</h3>
<ol id="leaders"></ol>
<button onclick="submitScoreToLeaderboard()">Submit Score</button>
</div>

<div class="game">
<h1>Shrimp Clicker 🦐</h1>
<div>Player: <span id="playerNameDisplay">Guest</span></div>
<div id="shrimp" class="shrimp"></div>
<h2>Shrimps: <span id="counter">0</span></h2>
</div>

<script>
const API_URL = "https://shrimp-leaderboard-api.vercel.app/";

let shrimp = 0;
let bestShrimp = 0;
let playerName = localStorage.getItem("playerName") || "";

const leadersList = document.getElementById("leaders");
const counterEl = document.getElementById("counter");
const playerNameDisplay = document.getElementById("playerNameDisplay");

if(playerName) playerNameDisplay.textContent = playerName;

document.getElementById("shrimp").addEventListener("click", ()=>{
  shrimp++;
  counterEl.textContent = shrimp;
  if(shrimp > bestShrimp) bestShrimp = shrimp;
});

async function loadLeaderboard(){
  try{
    const r = await fetch(API_URL);
    return await r.json();
  }catch(e){
    leadersList.innerHTML="<li>Offline</li>";
    return [];
  }
}

async function renderLeaderboard(){
  const list = await loadLeaderboard();
  leadersList.innerHTML="";
  if(!list.length){
    leadersList.innerHTML="<li>No entries yet</li>";
    return;
  }
  list.forEach(e=>{
    const li=document.createElement("li");
    li.innerHTML=`<span>${e.name}</span><span>${e.shrimps}</span>`;
    leadersList.appendChild(li);
  });
}

async function submitScoreToLeaderboard(){
  let name = playerName;
  if(!name){
    name = prompt("Enter nickname") || "Player";
    playerName = name;
    localStorage.setItem("playerName", name);
    playerNameDisplay.textContent = name;
  }

  const entry = {
    name,
    shrimps: bestShrimp,
    date: Date.now()
  };

  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(entry)
    });
    alert("Score submitted!");
    renderLeaderboard();
  }catch(e){
    alert("Submit failed");
  }
}

renderLeaderboard();
setInterval(renderLeaderboard,30000);
</script>

</body>
</html>
